<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FriendConnect - Chat Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { --accent:#8b5cf6; --accent-dark:#7c3aed; --bg:#0f172a; --panel:#1e293b; --border:#334155; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { margin:0; font-family:'Outfit', system-ui, sans-serif; background:var(--bg); color:#f8fafc; display:flex; flex-direction:column; height:100vh; }
  header { background:var(--panel); color:#fff; padding:1rem 1.5rem; font-weight:700; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .brand { font-size:1.2rem; font-weight:800; background:linear-gradient(90deg, #ec4899, #a855f7, #38bdf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .nav-back { color:#94a3b8; text-decoration:none; font-size:0.9rem; font-weight:600; transition:color 0.2s; }
  .nav-back:hover { color:#f8fafc; }

  /* --- In-Chat Celebratory Match Header Banner --- */
  .match-banner {
    background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
    border: 1px solid rgba(168, 85, 247, 0.4);
    border-radius: 1rem;
    padding: 1rem 1.25rem;
    margin: 1rem auto 0.5rem auto;
    max-width: 800px;
    width: calc(100% - 2rem);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    animation: slideDown 0.3s ease-out;
  }
  .match-banner.hidden { display: none; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .match-badge {
    background: linear-gradient(90deg, #ec4899, #8b5cf6);
    color: #fff;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 0.25rem 0.75rem;
    border-radius: 9999px;
    display: inline-block;
    margin-bottom: 0.4rem;
  }
  .match-link-box {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    color: #cbd5e1;
    flex-wrap: wrap;
  }
  .match-url {
    color: #38bdf8;
    font-weight: 600;
    text-decoration: underline;
  }
  .btn-copy {
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--border);
    color: #fff;
    padding: 0.25rem 0.6rem;
    border-radius: 0.4rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .btn-new-match {
    background: linear-gradient(90deg, #8b5cf6, #3b82f6);
    color: #fff;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 0.65rem 1.1rem;
    border: none;
    border-radius: 0.65rem;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn-new-match:hover {
    transform: scale(1.02);
    opacity: 0.95;
  }

  #log { flex:1; overflow-y:auto; padding:1.2rem; max-width:800px; width:100%; margin:0 auto; }
  .msg { margin:.75rem 0; }
  .msg.user { text-align:right; }
  .bubble { display:inline-block; padding:.75rem 1.1rem; border-radius:1rem; background:var(--panel); border:1px solid var(--border); text-align:left; max-width:85%; white-space:pre-wrap; font-size:0.98rem; line-height:1.5; }
  .msg.user .bubble { background:linear-gradient(90deg, #8b5cf6, #3b82f6); color:#fff; border:none; }
  .bubble.rich { background:transparent; border:none; padding:0; max-width:100%; white-space:normal; }
  form { display:flex; gap:.75rem; padding:1.2rem; border-top:1px solid var(--border); background:var(--panel); max-width:800px; width:100%; margin:0 auto; border-radius:1rem 1rem 0 0; }
  input { flex:1; padding:.85rem 1.1rem; background:#0f172a; border:1px solid var(--border); border-radius:0.75rem; color:#fff; font-size:1rem; font-family:inherit; outline:none; }
  input:focus { border-color:var(--accent); }
  button { padding:.85rem 1.4rem; border:none; border-radius:0.75rem; background:linear-gradient(90deg, #ec4899, #8b5cf6); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; transition:opacity 0.2s; }
  button:hover { opacity:0.9; }

  /* --- A2UI component styles --- */
  .a2card { border:1px solid var(--border); border-radius:12px; padding:1.2rem; background:var(--panel); box-shadow:0 4px 12px rgba(0,0,0,.3); max-width:100%; margin-top:0.5rem; }
  .a2col { display:flex; flex-direction:column; gap:.5rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; color:#f8fafc; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; color:#38bdf8; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; color:#a855f7; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:#94a3b8; }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.5rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:10px; display:block; border:1px solid var(--border); margin-top:0.5rem; filter: blur(6px); transition: filter 0.3s ease; cursor: pointer; }
  .a2img:hover { filter: blur(0px); }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; vertical-align:middle; color:#38bdf8; }
</style>
</head>
<body>
<header>
  <div class="brand">FriendConnect ✨</div>
  <a href="/" class="nav-back">← Back to Home</a>
</header>

<!-- Celebratory Match Banner at top of page -->
<div id="matchBanner" class="match-banner hidden">
  <div class="match-banner-content">
    <div class="match-badge">🎉 Match Found!</div>
    <div class="match-link-box">
      <span>Pair Link:</span>
      <a id="matchLinkUrl" href="#" target="_blank" class="match-url">/match/link-xxx</a>
      <button onclick="copyMatchLink()" class="btn-copy">Copy</button>
    </div>
  </div>
  <button onclick="requestNewMatch()" class="btn-new-match">Find me another match 🔄</button>
</div>

<div id="log"></div>
<form id="form">
  <input id="input" placeholder="Say hi or tell FriendConnect what you love..." autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const matchBanner = document.getElementById("matchBanner");
const matchLinkUrl = document.getElementById("matchLinkUrl");

// Persistent anonymous session ID
let anonId = localStorage.getItem('friendconnect_anon_id');
if (!anonId) {
  anonId = 'anon_' + Math.random().toString(36).substring(2, 12);
  localStorage.setItem('friendconnect_anon_id', anonId);
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function checkAndShowMatchBanner(textStr) {
  const match = textStr.match(/\/match\/(link-[a-zA-Z0-9]+)/);
  if (match) {
    const path = match[0];
    matchLinkUrl.href = path;
    matchLinkUrl.textContent = path;
    matchBanner.classList.remove("hidden");
  }
}

function copyMatchLink() {
  const fullUrl = window.location.origin + matchLinkUrl.getAttribute("href");
  navigator.clipboard.writeText(fullUrl).then(() => {
    alert("Match link copied to clipboard!");
  });
}

async function sendMessage(text) {
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, user_id: anonId })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

function requestNewMatch() {
  // Hide header
  matchBanner.classList.add("hidden");
  // Trigger agent to find a new match
  sendMessage("thank you! but find me another match");
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    b.appendChild(el("div", null, textStr));
    checkAndShowMatchBanner(textStr);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
    checkAndShowMatchBanner(flattenText(a2ui));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  sendMessage(text);
});
</script>
</body>
</html>
